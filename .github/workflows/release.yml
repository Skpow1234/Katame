name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Run goreleaser in --snapshot mode (no publish)"
        required: false
        default: "false"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  # Required by cosign / Sigstore for keyless signing.
  id-token: write

# Force the installed Go to be used (no toolchain auto-download) so the released
# binaries are built with the patched stdlib. With GOTOOLCHAIN=local, setup-go
# installs the `go` line from go.mod — keep that patch version current.
env:
  GOTOOLCHAIN: local

jobs:
  # Fail fast before signing or publishing if the tree is unhealthy.
  preflight:
    name: Preflight (test + govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Test (race)
        run: go test -race -count=1 -timeout 180s ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  goreleaser:
    name: GoReleaser (cosign-signed)
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@v0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify cosign
        run: cosign version

      - name: Resolve release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # Chocolatey needs the `choco` CLI (Windows only); see the chocolatey job.
          args: >-
            release
            --clean
            --skip=chocolatey
            ${{ github.event.inputs.snapshot == 'true' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # COSIGN_EXPERIMENTAL=1 enables keyless signing path on older cosign
          # versions; it is the default since cosign v2.0.0 but kept here for safety.
          COSIGN_EXPERIMENTAL: "1"
          # Tokens for package-manager publishing. Always defined (empty when a
          # secret is unset) so goreleaser templates resolve; empty values skip
          # the corresponding publish step without failing the release.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          WINGET_PUBLISH_TOKEN: ${{ secrets.WINGET_PUBLISH_TOKEN }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Spot-check cosign signature (linux amd64 archive)
        if: github.event.inputs.snapshot != 'true'
        run: |
          set -euo pipefail
          archive=$(ls dist/katame-linux-amd64.tar.gz 2>/dev/null | head -n1 || true)
          if [ -z "$archive" ]; then
            echo "linux amd64 archive not found; listing dist/"
            ls -la dist/ || true
            exit 1
          fi
          cosign verify-blob \
            --certificate "${archive}.pem" \
            --signature "${archive}.sig" \
            --certificate-identity-regexp 'https://github.com/Skpow1234/Katame' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$archive"
          echo "cosign verify-blob ok for $archive"

      - name: Upload release artifacts (snapshot)
        if: github.event.inputs.snapshot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: goreleaser-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sig
            dist/*.pem
            dist/*.sbom.json
            dist/checksums-sha256.txt
          retention-days: 14
          if-no-files-found: error

  # Chocolatey needs the `choco` CLI, which only runs on Windows.
  chocolatey:
    name: Chocolatey package
    needs: goreleaser
    if: github.event.inputs.snapshot != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser (chocolatey only)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            release
            --clean
            --skip=announce,publish,homebrew,scoop,winget,cloudsmith,sbom,sign
        env:
          GOTOOLCHAIN: local
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

      - name: Upload .nupkg to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          nupkg=$(find dist -name '*.nupkg' -print -quit)
          if [ -z "$nupkg" ]; then
            echo "no .nupkg found in dist/"
            exit 1
          fi
          gh release upload "v${{ needs.goreleaser.outputs.version }}" "$nupkg" --clobber
