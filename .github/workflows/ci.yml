name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Force CI to use exactly the Go version installed by setup-go and to ignore
# any `toolchain` directive auto-download. Without this, `go` may fetch a
# different toolchain and reintroduce stdlib vulns.
env:
  GOTOOLCHAIN: local

jobs:
  # -------------------------------------------------------------------------
  # Module integrity
  # -------------------------------------------------------------------------
  tidy:
    name: Go mod tidy / verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module checksums
        run: go mod verify

      - name: Check go.mod / go.sum tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy; run 'go mod tidy' and commit"
            exit 1
          fi

  # -------------------------------------------------------------------------
  # Lint
  # -------------------------------------------------------------------------
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: ./...

  # -------------------------------------------------------------------------
  # Unit tests (cross-OS, race on Linux)
  # -------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests (race)
        if: runner.os != 'Windows'
        run: go test -race -count=1 -timeout 180s ./...

      # Race detector on Windows is slower and more flaky under GHA; still run
      # the full suite without -race so platform-specific code paths are covered.
      - name: Run tests
        if: runner.os == 'Windows'
        run: go test -count=1 -timeout 180s ./...

      - name: Run vet
        run: go vet ./...

      - name: Coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -count=1 -timeout 180s -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt
          tail -n 1 coverage.txt

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
          retention-days: 14

      - name: Benchmarks (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: go test ./internal/crypto ./internal/bundle -run=^$ -bench=. -benchmem -count=1

  # -------------------------------------------------------------------------
  # Security
  # -------------------------------------------------------------------------
  security:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # -------------------------------------------------------------------------
  # Fuzz (short, matrixed)
  # -------------------------------------------------------------------------
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # NOTE: `go test -fuzz=...` only accepts a SINGLE package, never a `/...` glob.
        # `internal/crypto/...` resolves to both `crypto` and `crypto/aesgcmsiv`, so we
        # use the non-recursive path here.
        include:
          - target: FuzzUnmarshalManifest
            package: ./internal/bundle
          - target: FuzzCanonicalManifest
            package: ./internal/bundle
          - target: FuzzDecryptAESGCM
            package: ./internal/crypto
          - target: FuzzEncryptDecryptRoundTrip
            package: ./internal/crypto
          - target: FuzzStreamEncryptDecryptRoundTrip
            package: ./internal/crypto
          - target: FuzzDecryptStreamCorrupted
            package: ./internal/crypto

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz ${{ matrix.target }}
        run: go test -fuzz=${{ matrix.target }} -fuzztime=30s ${{ matrix.package }}

      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: |
            **/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 30

  # -------------------------------------------------------------------------
  # Cross-compile + smoke
  # -------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [tidy, lint, test, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          BIN="katame-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          go build -trimpath -ldflags "-s -w -X github.com/Skpow1234/Katame/internal/cli.Version=${GITHUB_SHA::7}" \
            -o "$BIN" ./cmd/katame
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          ls -la "$BIN"

      - name: Smoke test (native linux/amd64)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./"$BIN" --version
          ./"$BIN" --help >/dev/null
          echo "smoke ok"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: katame-${{ matrix.goos }}-${{ matrix.goarch }}
          path: katame-*
          retention-days: 14
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Container image
  # -------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [tidy, lint, test, security]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: katame:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke container
        run: |
          docker run --rm katame:ci --version
          docker run --rm katame:ci --help >/dev/null

  # -------------------------------------------------------------------------
  # Required status gate (branch protection can require this single check)
  # -------------------------------------------------------------------------
  ci-success:
    name: CI success
    if: always()
    needs: [tidy, lint, test, security, fuzz, build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate job results
        run: |
          echo "tidy=${{ needs.tidy.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "security=${{ needs.security.result }}"
          echo "fuzz=${{ needs.fuzz.result }}"
          echo "build=${{ needs.build.result }}"
          echo "docker=${{ needs.docker.result }}"
          for r in \
            "${{ needs.tidy.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.security.result }}" \
            "${{ needs.fuzz.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.docker.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::Required job finished with '$r' (want success)"
              exit 1
            fi
          done
          echo "All required CI jobs succeeded."
